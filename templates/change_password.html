{% extends "navigation.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<section class="profile-shell">
    <article class="panel profile-card">
        <p class="section-tag">PASSWORD</p>
        <h3>修改密码</h3>
        <p>请输入当前密码并设置新的登录密码。</p>

        <form class="profile-form" action="{{ url_for('change_password') }}" method="post">
            <div class="profile-field">
                <label for="page-current-password">当前密码</label>
                <input id="page-current-password" name="current_password" type="password" required>
            </div>
            <div class="profile-field">
                <label for="page-new-password">新密码</label>
                <input id="page-new-password" name="new_password" type="password" required>
            </div>
            <div class="profile-field">
                <label for="page-confirm-password">确认新密码</label>
                <input id="page-confirm-password" name="confirm_password" type="password" required>
            </div>
            <button class="profile-submit" type="submit">更新密码</button>
        </form>
    </article>
</section>
{% endblock %}
